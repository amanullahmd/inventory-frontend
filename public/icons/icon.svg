<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Box/Inventory Icon -->
  <g transform="translate(96, 96)" fill="white">
    <!-- Main box -->
    <path d="M160 0L320 80V240L160 320L0 240V80L160 0Z" fill="white" opacity="0.9"/>
    <!-- Box top -->
    <path d="M160 0L320 80L160 160L0 80L160 0Z" fill="white"/>
    <!-- Box front left -->
    <path d="M0 80L160 160V320L0 240V80Z" fill="white" opacity="0.7"/>
    <!-- Box front right -->
    <path d="M320 80L160 160V320L320 240V80Z" fill="white" opacity="0.85"/>
    <!-- Divider line -->
    <line x1="160" y1="160" x2="160" y2="320" stroke="#3b82f6" stroke-width="4"/>
    <!-- Top divider -->
    <line x1="80" y1="40" x2="240" y2="120" stroke="#3b82f6" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
